services:
  - type: web
    name: parker-os-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        sync: false   # Set to your Vercel URL
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: PRICE_TOLERANCE_PCT
        value: "5"
      - key: REFUND_REVIEW_THRESHOLD
        value: "500"
    healthCheckPath: /api/health
