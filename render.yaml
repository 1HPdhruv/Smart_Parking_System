services:
  - type: web
    name: parker-os-api
    runtime: node
    rootDir: backend
    branch: main
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard (Neon pooled URL)
      - key: DIRECT_DATABASE_URL
        sync: false   # Set in Render dashboard (Neon direct URL)
      - key: GEMINI_API_KEY
        sync: false   # Get from aistudio.google.com
      - key: JWT_SECRET
        sync: false   # openssl rand -hex 32
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        sync: false   # Your Vercel URL e.g. https://smart-parking-system-cpx7.vercel.app
      - key: MQTT_BROKER_URL
        sync: false   # Optional — skip if hardware not ready
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PRICE_TOLERANCE_PCT
        value: "5"
      - key: REFUND_REVIEW_THRESHOLD
        value: "500"
    healthCheckPath: /api/health
